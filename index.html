    <meta charset="UTF-8" />

    <meta name="theme-color" content="#FFFFFF" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="إدكاوي" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>إدكاوي - توصيل إدكو</title>
    <meta name="description" content="منصة توصيل الطلبات والمتاجر المحلية في مدينة إدكو بربط مباشر مع قاعدة بيانات سحابية حقيقية." />
    <meta property="og:title" content="إدكاوي - توصيل إدكو" />
    <meta property="og:description" content="منصة توصيل الطلبات والمتاجر المحلية في مدينة إدكو بربط مباشر مع قاعدة بيانات سحابية حقيقية." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('edkawi_theme_v2');
          var useDark = saved === 'dark' || (!saved && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var root = document.documentElement;
          if (useDark) {
            root.classList.add('dark');
            root.dataset.theme = 'dark';
          } else {
            root.classList.remove('dark');
            root.dataset.theme = 'light';
          }
        } catch (_) {}
      })();
    </script>
  </head>
  <body class="bg-white dark:bg-[#0F172A] text-[#1E293B] dark:text-[#F8FAFC] antialiased selection:bg-[#46D5D4]/30 selection:text-[#1E293B] dark:selection:text-[#F8FAFC]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
